<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
    <script src="index.js"></script>
    <title>M.J. Archires</title>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="index.html" class="navbar-brand-link">
            <div class="navbar-brand">
                <span class="brand-initials">M. J. </span>
                <span class="brand-name">Archires</span>
            </div>
        </a>
        <div class="navbar-profiles">
            <a href="/jiahui/" class="profile-link profile-link-jiahui" id="jiahui-link">
                <span class="profile-name">Jiahui Zhang</span>
            </a>
            <a href="#" class="profile-link profile-link-minma" id="minma-link">
                <span class="profile-name">Min Ma</span>
            </a>
        </div>
        <div class="navbar-toggle" id="navbar-toggle" onclick="navbarToggleList()">
            &#9776;
        </div>
        <ul class="navbar-list" id="navbar-list">
            <li><a href="/jiahui/" class="mobile-link-jiahui">Jiahui Zhang</a></li>
            <li><a href="#" class="mobile-link-minma">Min Ma</a></li>
        </ul>
    </nav>

    <!-- Archive Pages Container -->
    <div class="archive-container">
        <!-- Page 1: Welcome -->
        <section class="archive-page page-welcome" id="page-1">
            <div class="page-content">
                <div class="archive-header">
                    <div class="archive-stamp">EST. 2017</div>
                    <div class="archive-line"></div>
                </div>
                <h1 class="welcome-title" id="welcome-title"></h1>
                <p class="welcome-subtitle">Personal Archives & Portfolios</p>
                <div class="scroll-indicator">
                    <span>Scroll to Explore</span>
                    <div class="scroll-arrow">↓</div>
                </div>
            </div>
            <div class="page-corner-fold"></div>
        </section>

        <!-- Page 2: Profiles -->
        <section class="archive-page page-profiles" id="page-2">
            <div class="page-content">
                <div class="archive-header">
                    <div class="archive-stamp">COLLECTION</div>
                    <div class="archive-line"></div>
                </div>
                <h2 class="section-title">Featured Archives</h2>
                <div class="hero-cards">
                    <div class="card card-jiahui" onclick="navigateTo('/jiahui/')">
                        <div class="card-stamp">ARCHIVE #001</div>
                        <div class="card-overlay">
                            <h2>Jiahui Zhang</h2>
                            <p>Computer Science Graduate Student</p>
                            <div class="card-divider"></div>
                            <button class="card-button">Open Archive</button>
                        </div>
                        <div class="card-tape"></div>
                    </div>
                    <div class="card card-minma" onclick="navigateTo('#')">
                        <div class="card-stamp">ARCHIVE #002</div>
                        <div class="card-overlay">
                            <h2>Min Ma</h2>
                            <p>Coming Soon</p>
                            <div class="card-divider"></div>
                            <button class="card-button">Open Archive</button>
                        </div>
                        <div class="card-tape"></div>
                    </div>
                </div>
            </div>
            <div class="page-corner-fold"></div>
        </section>
    </div>

    <script>
        // Typewriter effect
        function typeWriter(text, element, speed = 100) {
            let i = 0;
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        // Navigation function
        function navigateTo(url) {
            if (url !== '#') {
                window.location.href = url;
            }
        }

        // Toggle mobile menu
        function navbarToggleList() {
            const navList = document.getElementById('navbar-list');
            if (navList.style.display === 'block') {
                navList.style.display = 'none';
            } else {
                navList.style.display = 'block';
            }
        }

        // Scroll animation for pages
        let currentPage = 1;
        let isScrolling = false;

        function handleScroll(event) {
            if (isScrolling) return;

            const delta = event.deltaY;
            const pages = document.querySelectorAll('.archive-page');

            if (delta > 0 && currentPage < pages.length) {
                // Scroll down
                isScrolling = true;
                currentPage++;
                scrollToPage(currentPage);
            } else if (delta < 0 && currentPage > 1) {
                // Scroll up
                isScrolling = true;
                currentPage--;
                scrollToPage(currentPage);
            }
        }

        function scrollToPage(pageNum) {
            const page = document.getElementById(`page-${pageNum}`);
            page.scrollIntoView({ behavior: 'smooth' });

            setTimeout(() => {
                isScrolling = false;
            }, 1000);
        }

        // Initialize
        window.addEventListener('load', function() {
            const titleElement = document.getElementById('welcome-title');
            typeWriter('Welcome to M.J. Archires', titleElement, 100);

            // Add scroll listener
            window.addEventListener('wheel', handleScroll, { passive: true });
        });
    </script>
</body>
</html>
